name: JustDoThree

options:
  bundleIdPrefix: com.todd
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16"
  createIntermediateGroups: true

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

schemes:
  JustDoThree:
    build:
      targets:
        JustDoThree: all
        JustDoThreeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JustDoThreeTests
    archive:
      config: Release
  JustDoThreeWatch:
    build:
      targets:
        JustDoThreeWatch: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  JustDoThree:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JustDoThree
      - path: JustDoThreeShared
    info:
      path: JustDoThree/Info.plist
      properties:
        CFBundleDisplayName: Just Do Three
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserNotificationUsageDescription: "Just Do Three uses notifications to send optional morning and evening reminders."
        NSCalendarsFullAccessUsageDescription: "Just Do Three uses calendar access to add tasks as iPhone Calendar events."
        NSRemindersFullAccessUsageDescription: "Just Do Three uses reminders access to add tasks as iPhone reminders."
        NSMicrophoneUsageDescription: "Just Do Three uses the microphone so you can dictate tasks instead of typing."
        NSSpeechRecognitionUsageDescription: "Just Do Three uses speech recognition to turn your dictation into task text."
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: JustDoThreeWatch
        embed: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todd.justdothree
        DEVELOPMENT_TEAM: 3ZAS78KQUH
        MARKETING_VERSION: "3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: JustDoThree/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEAD_CODE_STRIPPING: YES

  JustDoThreeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JustDoThreeTests
    dependencies:
      - target: JustDoThree
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todd.justdothree.tests
        DEVELOPMENT_TEAM: 3ZAS78KQUH
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  JustDoThreeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: JustDoThreeWatch
      - path: JustDoThreeShared
    info:
      path: JustDoThreeWatch/Info.plist
      properties:
        CFBundleDisplayName: Just Do Three
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.todd.justdothree
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todd.justdothree.watchkitapp
        DEVELOPMENT_TEAM: 3ZAS78KQUH
        MARKETING_VERSION: "3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: JustDoThreeWatch/Info.plist
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          DEAD_CODE_STRIPPING: YES
